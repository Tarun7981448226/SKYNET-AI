name: SKYNET morning summary

# Once-daily digest, separate from the hourly pipeline. Default time below
# is 12:00 UTC (4am Pacific / adjust the cron if you're elsewhere) — edit
# the cron expression to change it.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
  TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send morning summary
        run: python -m backend.cli jobs summary
